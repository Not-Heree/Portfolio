    .icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      width: 32px;
      height: 32px;
      transition: transform 0.2s ease;
    }

    .icon-link svg {
      width: 100%;
      height: 100%;
      fill: #ffffff; /* Default color: White */
      transition: fill 0.3s ease;
    }

    /* Hover Effects */
    .icon-link:hover {
      transform: translateY(-3px); /* Moves up slightly */
      cursor: pointer;
    }
    .icon-link:hover svg {
      fill: #8ab4f8; /* Changes to blue on hover */
    }

  <script>
    /* ----------------------------------------------------
       PARTICLE BACKGROUND SCRIPT
    ----------------------------------------------------- */
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");

    let particles = [];
    const particleCount = 80;
    const maxDistance = 120;

    let mouse = { x: null, y: null };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener("mouseleave", () => {
      mouse.x = null;
      mouse.y = null;
    });

    class Particle {
      constructor() {
        this.init();
      }
      init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = 2;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = (Math.random() - 0.5) * 0.4;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fill();
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

        if (mouse.x !== null && mouse.y !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          const radius = 150;
          const strength = 0.03;

          if (dist > 0 && dist < radius) {
            const force = (radius - dist) / radius;
            const directionX = -dx / dist; // repel
            const directionY = -dy / dist;

            this.x += directionX * force * strength * 60;
            this.y += directionY * force * strength * 60;
          }
        }

        this.draw();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function connectParticles() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < maxDistance) {
            ctx.strokeStyle = "rgba(255,255,255," + (1 - dist / maxDistance) * 0.3 + ")";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => p.update());
      connectParticles();
      requestAnimationFrame(animate);
    }

    initParticles();
    animate();
  </script>
