<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>thapabishwas | Security Researcher</title>
  
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Not-Heree/Portfolio/refs/heads/secondbranch/logo%20.png" />

  <style>
    :root {
      --neon-yellow: #FFFF00;
      --neon-dim: rgba(255, 255, 0, 0.2);
      --bg-color: #050505;
      --text-white: #e0e0e0;
      --terminal-gray: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-color);
      color: var(--text-white);
      font-family: 'Courier New', Courier, monospace; 
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    canvas { position: fixed; inset: 0; z-index: 0; }

    .content {
      position: relative;
      z-index: 1;
      height: 100vh;
      width: 100vw;
      /* Scanline overlay */
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
        pointer-events: auto;
        width: 90%;
        max-width: 800px;
        background: rgba(5, 5, 5, 0.6); 
        padding: 40px;
        border-left: 2px solid var(--neon-yellow);
        backdrop-filter: blur(2px);
        display: flex;
        flex-direction: column;
    }

    /* --- GLITCH NAME STYLES --- */
    .identity { margin-bottom: 20px; }
    .prompt { color: var(--terminal-gray); font-size: 1.2rem; }
    
    h1.glitch {
      font-size: 3.5rem;
      font-weight: 700;
      text-transform: lowercase;
      position: relative;
      color: var(--neon-yellow);
      text-shadow: 0 0 10px var(--neon-dim);
    }

    @keyframes glitch-skew {
      0% { transform: skew(0deg); } 20% { transform: skew(-2deg); } 40% { transform: skew(2deg); } 60% { transform: skew(-1deg); } 80% { transform: skew(1deg); } 100% { transform: skew(0deg); }
    }
    
    h1.glitch::before, h1.glitch::after {
      content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--bg-color);
    }
    h1.glitch::before {
      left: 2px; text-shadow: -1px 0 #ff00c1; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse;
    }
    h1.glitch::after {
      left: -2px; text-shadow: -1px 0 #00fff9; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim2 5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip: rect(10px, 9999px, 30px, 0); } 20% { clip: rect(60px, 9999px, 80px, 0); } 40% { clip: rect(20px, 9999px, 90px, 0); } 60% { clip: rect(80px, 9999px, 10px, 0); } 80% { clip: rect(40px, 9999px, 50px, 0); } 100% { clip: rect(70px, 9999px, 20px, 0); }
    }
    @keyframes glitch-anim2 {
      0% { clip: rect(50px, 9999px, 10px, 0); } 20% { clip: rect(20px, 9999px, 90px, 0); } 40% { clip: rect(80px, 9999px, 50px, 0); } 60% { clip: rect(10px, 9999px, 60px, 0); } 80% { clip: rect(30px, 9999px, 40px, 0); } 100% { clip: rect(90px, 9999px, 20px, 0); }
    }

    /* --- BIO CONSOLE STYLES --- */
    .console-lines { font-size: 1.1rem; line-height: 1.6; min-height: 150px; }
    .line { display: block; margin-bottom: 5px; opacity: 0; animation: fadeIn 0.2s forwards; }
    .highlight { color: #fff; font-weight: bold; }
    .command { color: var(--neon-yellow); margin-right: 10px; }
    @keyframes fadeIn { to { opacity: 1; } }

    /* --- SOCIAL ICONS --- */
    .social-icons { display: flex; gap: 25px; margin-top: 30px; border-top: 1px dashed #333; padding-top: 20px; }
    .icon-link { width: 28px; height: 28px; transition: transform 0.2s; }
    .icon-link svg { fill: #666; transition: 0.3s; }
    .icon-link:hover { transform: scale(1.1); }
    .icon-link:hover svg { fill: var(--neon-yellow); filter: drop-shadow(0 0 5px var(--neon-yellow)); }

    /* --- HIDDEN WATERMARK (Increased Visibility) --- */
    .hidden-watermark {
        margin-top: 40px;
        font-size: 4rem;
        font-weight: 900;
        
        /* CHANGED: Made lighter gray so it's more visible */
        color: #1c1c1c; 
        
        text-align: center;
        letter-spacing: 10px;
        user-select: none;
        pointer-events: none;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    @media (max-width: 600px) {
        h1.glitch { font-size: 2.5rem; }
        .container { width: 95%; padding: 20px; }
        .hidden-watermark { font-size: 2.5rem; letter-spacing: 5px; }
    }
  </style>
</head>
<body>
  
  <canvas id="bg"></canvas>

  <div class="content">
    <div class="container">
        <!-- IDENTITY SECTION -->
        <div class="identity">
            <span class="prompt">root@system:~# whoami</span>
            <h1 class="glitch" data-text="thapabishwas">thapabishwas</h1>
        </div>

        <!-- BIO SECTION -->
        <div class="console-lines" id="console"></div>

        <!-- SOCIALS -->
        <div class="social-icons">
             <!-- GitHub -->
            <a href="https://github.com/Not-Heree" target="_blank" class="icon-link">

  </div>

  <script>
    /* ----------------------------------------------------
       1. TYPEWRITER EFFECT
    ----------------------------------------------------- */
    const consoleDiv = document.getElementById('console');
    const logData = [
      { label: "ROLE", val: "Security Researcher" },
      { label: "STATUS", val: "Learning... Growing... Evolving..." },
      { label: "INTERESTS", val: "Hardware / Software / Low-level" },
      { label: "OBJECTIVE", val: "To Learn & Exploit Systems" },
      { label: "PRONOUNS", val: "He/Him" }
    ];
    let lineIndex = 0;
    function typeLine() {
      if (lineIndex < logData.length) {
        const item = logData[lineIndex];
        const p = document.createElement('div');
        p.className = 'line';
        p.innerHTML = `<span class="command">[+] ${item.label}:</span> <span class="highlight">${item.val}</span>`;
        consoleDiv.appendChild(p);
        lineIndex++;
        setTimeout(typeLine, 400);
      }
    }
    setTimeout(typeLine, 500);

    /* ----------------------------------------------------
       2. PARTICLE BACKGROUND (Smoother Repel)
    ----------------------------------------------------- */
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    let particles = [];
    const particleCount = 100;
    
    // CHANGED: Reduced Radius (less range)
    const repelRadius =90 

    let mouse = { x: null, y: null };

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    window.addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener("mouseleave", () => { mouse.x = null; mouse.y = null; });

    class Particle {
      constructor() { this.init(); }
      init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2 + 1; 
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = (Math.random() - 0.5) * 0.4;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 0, 0.8)";
        ctx.fill();
      }
      update() {
        this.x += this.speedX; this.y += this.speedY;
        
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        
        // GENTLE Repel Logic
        if (mouse.x) {
          const dx = mouse.x - this.x; const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < repelRadius) {
            const force = (repelRadius - dist) / repelRadius;
            
            // CHANGED: Reduced Strength (Gentle Push)
            const repelStrength = 5; 
            
            this.x -= (dx/dist) * force * repelStrength;
            this.y -= (dy/dist) * force * repelStrength;
          }
        }
        this.draw();
      }
    }
    
    function initParticles() { particles = []; for(let i=0; i<particleCount; i++) particles.push(new Particle()); }
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => p.update());
      requestAnimationFrame(animate);
    }
    initParticles();
    animate();
  </script>
